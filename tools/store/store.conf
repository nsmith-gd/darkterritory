# Where tools/upload.sh sends a build (roadmap M6). Sourced by bash, so no spaces around '='.
# The IDs aren't secrets; the credentials are (tools/store/README.md). A 0 means the app doesn't exist yet: a dry run
# goes ahead with it, a real upload refuses.

# Steamworks: App Admin > SteamPipe > Depots. The game and its demo are separate apps, each with a depot per platform.
STEAM_APP=0
STEAM_DEPOT_WIN=0
STEAM_DEPOT_LINUX=0
STEAM_DEMO_APP=0
STEAM_DEMO_DEPOT_WIN=0
STEAM_DEMO_DEPOT_LINUX=0

# itch.io: the project page as user/game. The demo goes to the same page on its own channels (windows-demo, linux-demo).
ITCH_TARGET=
ITCH_CHANNEL_WIN=windows
ITCH_CHANNEL_LINUX=linux
