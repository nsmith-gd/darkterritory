name: CI
# Runner time is shared by every agent's branch, so a run happens once per change that can break the build:
# - a branch's pushes are built by its pull request, not twice (push runs only for main);
# - a newer push to the same PR cancels the run it supersedes (main keeps every run: its packages are the builds);
# - commits touching only docs/ and the top-level guides build nothing (tests read content/, never docs/).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'CLAUDE.md', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'CLAUDE.md', 'README.md']
  workflow_dispatch:
# A pull request's runs share a group, so a newer push cancels the older run. Anything else (a push to main, a run by
# hand) is a group of its own: one shared group would still let a newer push to main cancel a pending one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The review packet reads main's runs and downloads their gallery (actions: read); nothing here writes to the repository.
permissions:
  contents: read
  actions: read
jobs:
  build-test:
    strategy:
      # Each OS reports in full: one failing doesn't cancel the other (a Windows-only failure left every PR without its
      # Linux result, the screenshots and the replay check among them).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Software Vulkan (lavapipe) and a simulated headset (Monado) for headless render and VR tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xvfb monado-service libopenxr1-monado libopenxr-loader1
      - name: Start the simulated headset
        if: runner.os == 'Linux'
        run: |
          tools/xr-sim.sh
          echo "XDG_RUNTIME_DIR=/tmp/xr" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Formatting doesn't differ by OS; once is enough.
      - run: dotnet format Ballast.slnx --verify-no-changes
        if: runner.os == 'Linux'
      - run: dotnet build Ballast.slnx -c Release
      - run: dotnet test --solution Ballast.slnx -c Release --no-build
      - run: dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- train table
      - run: dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- art check
      # The gallery (tools/review/gallery.txt), drawn in one process with one dressed renderer (note 517: the look's layers
      # load once, so a shot after the first is seconds, not the half-minute a process of its own took). Main keeps it on
      # every merge as the screenshots artifact, with the numbers a change can move (numbers.json). A pull request draws it
      # too and compares it with main's at its base: the review packet, its summary on the run's page and its strips in the
      # review-packet artifact for the PR's agent to show the director (tools/review/packet.sh).
      - name: Screenshots, the whole gallery
        if: runner.os == 'Linux'
        run: tools/review/gallery.sh
      - name: The review packet (what this pull request changed in the gallery and the numbers)
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/review/packet.sh ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        with:
          name: review-packet
          path: out/review/
      - name: VR session end to end (Monado's simulated headset)
        if: runner.os == 'Linux'
        run: |
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- vr check --frames 30 --out out/shots/vr.png | tee out/vr.json
          jq -e '.headset and .framesRendered == 30 and (.states | index("Exiting"))' out/vr.json
          # The HUD and the menus on their panels in both eyes (T36).
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- vr check --frames 20 --hud --out out/shots/vr-hud.png | tee out/vr-hud.json
          jq -e '.framesRendered == 20 and (.overlayVertices | all(. > 1000))' out/vr-hud.json
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- vr check --frames 20 --menu title --out out/shots/vr-menu.png | tee out/vr-menu.json
          jq -e '.framesRendered == 20 and (.overlayVertices | all(. > 1000))' out/vr-menu.json
      - name: Prototype window smoke test (Xvfb + lavapipe)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet run --project src/DarkTerritory.App -c Release --no-build -- --route frontier:7 --throttle 1 --quit-after 10 --capture out/shots/app.png
      - name: Audio renders (spec A.3 tell audit)
        if: runner.os == 'Linux'
        run: |
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- audio render --scenario chaos --listener 19 --out out/audio/chaos-guard.wav
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- audio render --scenario tells --listener 0 --out out/audio/tells-cab.wav
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- audio render --scenario bed --listener 5 --out out/audio/bed-roof.wav
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: screenshots
          path: out/shots/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: audio
          path: out/audio/
      # Cross-play (T116): a joiner builds the host's night itself and is refused if its line or land comes out different, so
      # each OS writes the checksums for some nights and the crossplay job below compares them.
      - name: Line and land checksums
        shell: bash
        run: |
          mkdir -p out/prints
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- linegen prints > out/prints/${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: prints-${{ runner.os }}
          path: out/prints/
      # A night recorded on Windows plays again on Linux tick for tick (note 515: the director records on Windows, the
      # agents replay on Linux). Main only: RecordReplayTests holds the replay on each OS on every pull request.
      - name: A recorded night, for the other OS to replay
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- replay record --route frontier:7 --bots 2 --seconds 15 --out out/recordings
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        with:
          name: recording-Windows
          path: out/recordings/
  # Windows and Linux build the same night from the same seed, or they can't play together.
  crossplay:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prints-*
          merge-multiple: true
          path: prints
      - name: Windows and Linux make the same lines and land
        run: |
          cat prints/Linux.json
          diff <(tr -d '\r' < prints/Linux.json) <(tr -d '\r' < prints/Windows.json) && echo "cross-play: the same nights on both"
  # Windows' recorded night replayed on Linux, checked tick by tick against what its host sent (note 515).
  replay-crossplay:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build src/DarkTerritory.Cli -c Release
      - uses: actions/download-artifact@v4
        with:
          name: recording-Windows
          path: recordings
      - name: Windows' night on Linux, tick for tick
        run: |
          f=$(ls recordings/*.dtrec | head -1)
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- replay "$f" | tee replay.json
          jq -e '.divergedAt == null and (.truncated | not) and .steps > 400' replay.json
  # Builds for players (roadmap M6): self-contained Windows and Linux folders with their content, zipped. The Linux one
  # is started from somewhere else and plays a few seconds, so a build that can't find its content never ships.
  package:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Software Vulkan (lavapipe) for the smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xvfb zip
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: tools/package.sh --demo win-x64 linux-x64
      - name: The packaged game starts from anywhere and plays
        run: |
          cd "$RUNNER_TEMP"
          xvfb-run -a -s "-screen 0 1280x720x24" "$GITHUB_WORKSPACE/out/dist/DarkTerritory-linux-x64/DarkTerritory" --route frontier:7 --throttle 1 --quit-after 6 --mute --no-steam --capture "$GITHUB_WORKSPACE/out/dist/packaged.png"
          test -f "$GITHUB_WORKSPACE/out/dist/packaged.png"
          # The demo (T79) too, asked for a night it doesn't have: it plays the Frontier instead.
          xvfb-run -a -s "-screen 0 1280x720x24" "$GITHUB_WORKSPACE/out/dist/DarkTerritory-Demo-linux-x64/DarkTerritory" --route deadLines:3 --throttle 1 --quit-after 6 --mute --no-steam --capture "$GITHUB_WORKSPACE/out/dist/packaged-demo.png" | tee demo.log
          grep -q "no deadLines nights in it" demo.log
          test -f "$GITHUB_WORKSPACE/out/dist/packaged-demo.png"
      - name: Store uploads, dry run (tools/store/README.md; the Release workflow sends them)
        run: |
          tools/upload.sh steam --dry-run --demo --branch beta
          grep -q '"SetLive" "beta"' out/store/steam/app_build_*.vdf
          grep -q 'DarkTerritory-Demo-win-x64' out/store/steam/app_build_*.vdf
          tools/upload.sh steam --dry-run
          jq -e '.dryRun and (.uploads | length == 2) and all(.uploads[]; .files > 100)' out/store/steam.json
          tools/upload.sh itch --dry-run
          jq -e '[.uploads[].channel] == ["windows", "linux"]' out/store/itch.json
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-win-x64
          path: out/dist/DarkTerritory-win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-linux-x64
          path: out/dist/DarkTerritory-linux-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-Demo-win-x64
          path: out/dist/DarkTerritory-Demo-win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-Demo-linux-x64
          path: out/dist/DarkTerritory-Demo-linux-x64/
