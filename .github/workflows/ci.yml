name: CI
# Runner time is shared by every agent's branch, so a run happens once per change that can break the build:
# - a branch's pushes are built by its pull request, not twice (push runs only for main);
# - a newer push to the same PR cancels the run it supersedes (main keeps every run: its packages are the builds);
# - commits touching only docs/ and the top-level guides build nothing (tests read content/, never docs/).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'CLAUDE.md', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'CLAUDE.md', 'README.md']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Software Vulkan (lavapipe) and a simulated headset (Monado) for headless render and VR tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xvfb monado-service libopenxr1-monado libopenxr-loader1
      - name: Start the simulated headset
        if: runner.os == 'Linux'
        run: |
          tools/xr-sim.sh
          echo "XDG_RUNTIME_DIR=/tmp/xr" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Formatting doesn't differ by OS; once is enough.
      - run: dotnet format Ballast.slnx --verify-no-changes
        if: runner.os == 'Linux'
      - run: dotnet build Ballast.slnx -c Release
      - run: dotnet test --solution Ballast.slnx -c Release --no-build
      - run: dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- train table
      - run: dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- art check
      - name: Screenshots
        if: runner.os == 'Linux'
        run: |
          for v in trackside roof cab chase ahead; do
            dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --view $v --out out/shots/$v.png
          done
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --view cab --throttle 0.75 --out out/shots/cab-levers.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1058,5,2.5 --target 1090,0,2 --fov 55 --out out/shots/threats-rear.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1184,6,3.4 --target 1185,0,2.6 --fov 55 --out out/shots/threats-cab.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1150,-22,2.5 --target 1180,-7,0.3 --fov 70 --out out/shots/threats-soot.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1166,-3.6,5.4 --target 1176,-1.4,4.0 --fov 60 --out out/shots/threats-dragger.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1218,7,2.0 --target 1209,3.2,1.9 --fov 45 --out out/shots/threats-lamplighter.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1262,2.5,2.4 --target 1295,0.3,1.8 --fov 45 --out out/shots/threats-ferryman.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1132,5,5.2 --target 1150,1.2,3.2 --fov 55 --out out/shots/threats-climbers.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1080,2.8,1.4 --target 1088,0,0.6 --fov 55 --out out/shots/threats-weight.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --threats --cam 1139,1.2,6.0 --target 1131,0.3,6.0 --fov 55 --out out/shots/threats-gaunt.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --view roof --crew --out out/shots/crew-arms.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --cars 4 --cam 1122,-0.4,2.8 --target 1130,0.4,2.0 --fov 75 --out out/shots/inside-guard.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --cars 4 --cam 1122,-0.4,2.8 --target 1130,0.4,2.0 --fov 75 --emergency --out out/shots/inside-guard-emergency.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --hud --route frontier:7 --out out/shots/hud.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --hud --spectating --out out/shots/hud-spectating.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:8 --site --out out/shots/site-winch.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:8 --site --crank --out out/shots/site-crank.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:8 --site --crane --out out/shots/site-crane.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route frontier:7 --site --out out/shots/site-crates.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:1 --coaling --cam 19464,7,5 --target 19480,-0.5,5 --fov 60 --out out/shots/coaling.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --bodies --cam 1146,2.5,6 --target 1141,0,4.1 --fov 60 --out out/shots/bodies.png
          # The art pass (ARCHITECTURE §8 note 48): the set pieces, and kit pieces on the turntable.
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route frontier:7 --at 7600 --cam 7860,-45,-3 --target 7900,0,-2 --fov 75 --out out/shots/viaduct.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:1 --at 14000 --cam 14100,1.5,3 --target 14224,0,3 --fov 65 --out out/shots/tunnel.png
          # Generated lines (docs/design/linegen-plan.md): boards, brass, a halt, a cutting, a washout, a trestle over its ravine.
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route frontier:7 --at 3300 --cam 3496,1.5,2.4 --target 3510,3.2,1.8 --fov 50 --out out/shots/lg-sign.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route frontier:7 --at 11300 --cam 11430,2,3 --target 11480,0,0.3 --fov 60 --out out/shots/lg-brass.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route frontier:7 --at 9700 --cam 9790,-8,3 --target 9830,2,1.5 --fov 65 --out out/shots/lg-halt.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:1 --at 16700 --cam 16900,2,3 --target 17000,0,3 --fov 70 --out out/shots/lg-cutting.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:1 --at 23000 --cam 23100,2,3 --target 23164,0,-0.5 --fov 60 --out out/shots/lg-washout.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:1 --at 7800 --cam 8000,-60,-20 --target 8000,0,-10 --fov 70 --out out/shots/lg-trestle.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route deadLines:1 --junction 4 --diverge --through --view chase --out out/shots/lg-alternate.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- linegen generate --route frontier:7 --cars 6 --map out/shots/lg-map.png --profile out/shots/lg-profile.png
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --route frontier:7 --at 330 --cam 250,7,2.2 --target 330,5,2.5 --fov 65 --out out/shots/station.png
          # Wear and tear (look.json "damage"): the cars from sound at the front to wrecked at the back.
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- screenshot --integrity 0.3,1,0.8,0.55,0.3,0.1 --cam 1126,-5.5,2.4 --target 1116,0,2.0 --fov 55 --out out/shots/damage.png
          for p in engine car-steel guard portal viaduct-bay car-wrecked; do
            dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- art show $p --out out/shots/art-$p.png
          done
      - name: VR session end to end (Monado's simulated headset)
        if: runner.os == 'Linux'
        run: |
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- vr check --frames 30 --out out/shots/vr.png | tee out/vr.json
          jq -e '.headset and .framesRendered == 30 and (.states | index("Exiting"))' out/vr.json
          # The HUD and the menus on their panels in both eyes (T36).
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- vr check --frames 20 --hud --out out/shots/vr-hud.png | tee out/vr-hud.json
          jq -e '.framesRendered == 20 and (.overlayVertices | all(. > 1000))' out/vr-hud.json
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- vr check --frames 20 --menu title --out out/shots/vr-menu.png | tee out/vr-menu.json
          jq -e '.framesRendered == 20 and (.overlayVertices | all(. > 1000))' out/vr-menu.json
      - name: Prototype window smoke test (Xvfb + lavapipe)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet run --project src/DarkTerritory.App -c Release --no-build -- --route frontier:7 --throttle 1 --quit-after 10 --capture out/shots/app.png
      - name: Audio renders (spec A.3 tell audit)
        if: runner.os == 'Linux'
        run: |
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- audio render --scenario chaos --listener 19 --out out/audio/chaos-guard.wav
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- audio render --scenario tells --listener 0 --out out/audio/tells-cab.wav
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- audio render --scenario bed --listener 5 --out out/audio/bed-roof.wav
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: screenshots
          path: out/shots/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: audio
          path: out/audio/
      # Cross-play (T116): a joiner builds the host's night itself and is refused if its line or land comes out different, so
      # each OS writes the checksums for some nights and the crossplay job below compares them.
      - name: Line and land checksums
        shell: bash
        run: |
          mkdir -p out/prints
          dotnet run --project src/DarkTerritory.Cli -c Release --no-build -- linegen prints > out/prints/${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: prints-${{ runner.os }}
          path: out/prints/
  # Windows and Linux build the same night from the same seed, or they can't play together.
  crossplay:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prints-*
          merge-multiple: true
          path: prints
      - name: Windows and Linux make the same lines and land
        run: |
          cat prints/Linux.json
          diff <(tr -d '\r' < prints/Linux.json) <(tr -d '\r' < prints/Windows.json) && echo "cross-play: the same nights on both"
  # Builds for players (roadmap M6): self-contained Windows and Linux folders with their content, zipped. The Linux one
  # is started from somewhere else and plays a few seconds, so a build that can't find its content never ships.
  package:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Software Vulkan (lavapipe) for the smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xvfb zip
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: tools/package.sh --demo win-x64 linux-x64
      - name: The packaged game starts from anywhere and plays
        run: |
          cd "$RUNNER_TEMP"
          xvfb-run -a -s "-screen 0 1280x720x24" "$GITHUB_WORKSPACE/out/dist/DarkTerritory-linux-x64/DarkTerritory" --route frontier:7 --throttle 1 --quit-after 6 --mute --no-steam --capture "$GITHUB_WORKSPACE/out/dist/packaged.png"
          test -f "$GITHUB_WORKSPACE/out/dist/packaged.png"
          # The demo (T79) too, asked for a night it doesn't have: it plays the Frontier instead.
          xvfb-run -a -s "-screen 0 1280x720x24" "$GITHUB_WORKSPACE/out/dist/DarkTerritory-Demo-linux-x64/DarkTerritory" --route deadLines:3 --throttle 1 --quit-after 6 --mute --no-steam --capture "$GITHUB_WORKSPACE/out/dist/packaged-demo.png" | tee demo.log
          grep -q "no deadLines nights in it" demo.log
          test -f "$GITHUB_WORKSPACE/out/dist/packaged-demo.png"
      - name: Store uploads, dry run (tools/store/README.md; the Release workflow sends them)
        run: |
          tools/upload.sh steam --dry-run --demo --branch beta
          grep -q '"SetLive" "beta"' out/store/steam/app_build_*.vdf
          grep -q 'DarkTerritory-Demo-win-x64' out/store/steam/app_build_*.vdf
          tools/upload.sh steam --dry-run
          jq -e '.dryRun and (.uploads | length == 2) and all(.uploads[]; .files > 100)' out/store/steam.json
          tools/upload.sh itch --dry-run
          jq -e '[.uploads[].channel] == ["windows", "linux"]' out/store/itch.json
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-win-x64
          path: out/dist/DarkTerritory-win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-linux-x64
          path: out/dist/DarkTerritory-linux-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-Demo-win-x64
          path: out/dist/DarkTerritory-Demo-win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-Demo-linux-x64
          path: out/dist/DarkTerritory-Demo-linux-x64/
