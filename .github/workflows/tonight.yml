# Tonight's build (ARCHITECTURE §8 note 523): main with every open pull request on top whose head's checks are all green and
# that merges cleanly, in number order (tools/tonight/integrate.py; one that conflicts is left out and the test plan says
# why), built, packaged as the director's test build (a developer build, note 514) and checked for its developer tools.
# The zip carries TEST-PLAN.md: each merged pull request's title, link and "how to check" lines, and what was left out.
# D1 made these by hand (an integration branch, then the Test build workflow); this makes one every night. The integration
# is force-pushed to `tonight`, so anyone can build it again, or bisect it.
#
# Twice a day, for the director's playtests (the director, 15 Oct 2026: "Every evening I want a build at 5pm so I can play
# test at 7pm and I want a build at 7am so I can play test at 9am"; before that, 7:30 pm only): one build per slot, the
# first scheduled try after 5 pm or 7 am Montreal (the clock job; summer and winter alike, the tries cover both). Which
# Token Budget Manager watches each build is COORDINATION.md's "Playtest builds". Any other time: Actions > Tonight's build
# > Run workflow.
name: Tonight's build
on:
  schedule:
    # GitHub runs a schedule late, by minutes or hours (15 Oct: the 5 pm run came at 7:29 pm and the clock let it go),
    # so each slot has several tries, and the clock job builds once per slot: the first try after 5 pm (or 7 am)
    # Montreal builds, and the later ones see that slot's zip and stop.
    - cron: '0 21,22,23,0,1 * * *'
    - cron: '0 11,12,13,14,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read
  actions: read
concurrency:
  group: tonight
  cancel-in-progress: false
jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.montreal.outputs.go }}
    steps:
      - id: montreal
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # By hand, always. On the schedule, once per slot: the slot is the last 5 pm or 7 am Montreal gone by, and a
          # try builds only if no build has passed since then (a by-hand build counts).
          hour=$(TZ=America/Toronto date +%-H)
          if [ "$hour" -ge 17 ]; then at='today 17:00'; elif [ "$hour" -ge 7 ]; then at='today 07:00'; else at='yesterday 17:00'; fi
          slot=$(date -u -d "@$(TZ=America/Toronto date -d "$at" +%s)" +%Y-%m-%dT%H:%M:%SZ)
          # The slot's builds: this workflow's runs since the slot whose build job ran and passed (a skipped try's
          # doesn't count). By run, not by artifact: the repo's newest artifacts are mostly every PR's review packet.
          built=0
          for id in $(gh api "repos/$REPO/actions/workflows/tonight.yml/runs?created=%3E%3D$slot&per_page=30" --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id"); do
            n=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "tonight" and .conclusion == "success")] | length')
            built=$((built + n))
          done
          if [ "$EVENT" != schedule ] || [ "$built" = 0 ]; then go=true; else go=false; fi
          echo "Montreal: $(TZ=America/Toronto date '+%H:%M %Z'); slot from $slot; builds since: $built; go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"
  tonight:
    needs: clock
    if: needs.clock.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The merges need the history back to where each pull request branched.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zip
      - name: Main with the green pull requests on top
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python3 tools/tonight/integrate.py --repo "$GITHUB_REPOSITORY" --out out/tonight --run "$RUN_URL"
          cat out/tonight/TEST-PLAN.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build (warnings are errors)
        run: dotnet build Ballast.slnx -c Release
      - name: The director's build (Windows, the developer tools in)
        run: tools/package.sh --dev win-x64
      - name: The developer tools are in it
        run: dotnet run --project src/DarkTerritory.Cli -c Release -- build check out/dist/DarkTerritory-Dev-win-x64 --dev
      - name: The test plan in the zip
        run: cp out/tonight/TEST-PLAN.md out/tonight/tonight.json out/dist/DarkTerritory-Dev-win-x64/
      - uses: actions/upload-artifact@v4
        id: zip
        with:
          name: DarkTerritory-Dev-win-x64-tonight-${{ github.run_number }}
          path: out/dist/DarkTerritory-Dev-win-x64/
      # The same build for Linux, so a crewmate on Linux can play the director's night (crossplay: one commit, both
      # platforms). Uploaded as the zip package.sh makes, so the executable bit survives.
      - name: The same build for Linux
        run: |
          tools/package.sh --dev linux-x64
          cp out/tonight/TEST-PLAN.md out/tonight/tonight.json out/dist/DarkTerritory-Dev-linux-x64/
          (cd out/dist && rm -f DarkTerritory-Dev-linux-x64.zip && zip -qr DarkTerritory-Dev-linux-x64.zip DarkTerritory-Dev-linux-x64)
      - uses: actions/upload-artifact@v4
        with:
          name: DarkTerritory-Dev-linux-x64-tonight-${{ github.run_number }}
          path: out/dist/DarkTerritory-Dev-linux-x64.zip
      - name: The integration to `tonight`
        env:
          ZIP: ${{ steps.zip.outputs.artifact-url }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**The build:** $ZIP" >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_TOKEN may not push a commit that changes a workflow file, so a night with a pull request that does is
          # built and zipped all the same, and only the branch waits for a night without one.
          if git push --force origin HEAD:refs/heads/tonight; then
            echo "**The branch:** \`tonight\` at \`$(git rev-parse --short=10 HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::couldn't push tonight (a merged pull request changes a workflow file?): the build above is still tonight's"
            echo "**The branch:** not pushed tonight (see the warning); the build is still tonight's." >> "$GITHUB_STEP_SUMMARY"
          fi
