# The coordination docs' numbers (ARCHITECTURE §8 note 521): no pull request brings in a queue number or a §8 note number
# that's already taken, one another agent claimed on the claims branch (tools/coord/claim.py), or a second "next free
# number" line; and with §8 split into docs/notes/, its index stays whole. Seconds, no build: it runs on the docs-only pull
# requests too (claims, Done rows), which the CI workflow leaves out. On main it runs again after each merge, because two
# pull requests that each passed against an older main can still land the same number: the one that landed second is told.
name: Coordination
on:
  pull_request:
    paths: ['docs/COORDINATION.md', 'docs/ARCHITECTURE.md', 'docs/notes/**', 'tools/coord/**']
  push:
    branches: [main]
    paths: ['docs/COORDINATION.md', 'docs/ARCHITECTURE.md', 'docs/notes/**', 'tools/coord/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: The claims branch
        run: |
          if git fetch --depth=1 origin claims:refs/remotes/origin/claims 2>/dev/null; then
            echo "CLAIMS=--claims-ref origin/claims" >> "$GITHUB_ENV"
          fi
      - name: Every claim's number its own
        run: |
          # A pull request's merge commit's first parent is its base; on main, a merge's first parent is main before it.
          # Only what's new against it fails.
          python3 tools/coord/check.py --base-ref HEAD^1 $CLAIMS 2> problems.txt || { cat problems.txt; exit 1; }
      - name: Tell the pull request that landed second
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pr=$(printf '%s\n' "$MESSAGE" | head -1 | grep -oE '\(#[0-9]+\)$' | tr -d '(#)' || true)
          [ -n "$pr" ] || exit 0
          {
            echo "The Coordination check on main failed after this merged (note 521): another pull request landed the same number first."
            echo
            sed 's/^coord: /- /' problems.txt
            echo
            echo 'Take the next free numbers (`python3 tools/coord/check.py --next`, or `tools/coord/claim.py`) and land the renumbering in a small PR.'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > comment.md
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file comment.md
