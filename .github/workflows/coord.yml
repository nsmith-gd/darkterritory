# The coordination docs' numbers (ARCHITECTURE §8 note 521): no pull request brings in a queue number or a §8 note number
# that's already taken, or a second "next free number" line. Seconds, no build: it runs on the docs-only pull requests too
# (claims, Done rows), which the CI workflow leaves out.
name: Coordination
on:
  pull_request:
    paths: ['docs/COORDINATION.md', 'docs/ARCHITECTURE.md', 'tools/coord/**']
permissions:
  contents: read
jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Every claim's number its own
        run: |
          # The pull request's merge commit's first parent is its base: only what's new against it fails.
          mkdir -p "$RUNNER_TEMP/base/docs"
          git show HEAD^1:docs/COORDINATION.md > "$RUNNER_TEMP/base/docs/COORDINATION.md"
          git show HEAD^1:docs/ARCHITECTURE.md > "$RUNNER_TEMP/base/docs/ARCHITECTURE.md"
          python3 tools/coord/check.py --base "$RUNNER_TEMP/base"
